name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  node:
    uses: grand-stack/.github/.github/workflows/ci-node.yml@v1
    with:
      scripts: "lint test docs:check build"
  docker-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Breaking-change check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh scripts/schema-check.sh "origin/$BASE_REF"
      - run: docker build -t grandstack-server:ci .
      - name: Smoke test
        run: |
          # keep this Neo4j image the same as the one in grandstack/compose.yaml (version and digest)
          docker network create gs
          docker run -d --name neo4j --network gs -e NEO4J_AUTH=neo4j/ci-password neo4j:2026.10.0-community@sha256:388c0e5c6d4543e3d0e6cee3d1e751c05ad9314aa73342cc63cd0ea0946e38bb
          timeout 180 sh -c "until docker exec neo4j cypher-shell -u neo4j -p ci-password 'RETURN 1' >/dev/null 2>&1; do sleep 3; done"
          docker run -d --name server --network gs -p 4000:4000 -e NEO4J_URI=bolt://neo4j:7687 -e NEO4J_PASSWORD=ci-password grandstack-server:ci
          timeout 120 sh -c "until curl -sf localhost:4000/graphql -H 'content-type: application/json' -d '{\"query\":\"{ movies(limit:1){ title } }\"}' | grep -q title; do sleep 2; done"
      - name: Container logs
        if: failure()
        run: |
          docker logs neo4j 2>&1 | tail -40 || true
          docker logs server 2>&1 | tail -40 || true
