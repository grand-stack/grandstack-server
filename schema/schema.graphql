"""A film in the Movies graph."""
type Movie @node {
  """Film title. Unique within the dataset."""
  title: String!
  """Tagline shown on the poster."""
  tagline: String
  """Year the film was released."""
  released: Int
  """Audience rating from 0 to 10. Sample data, approximate."""
  rating: Float
  """Running time in minutes."""
  runtime: Int
  """Genres the film belongs to."""
  genres: [Genre!]! @relationship(type: "IN_GENRE", direction: OUT)
  """People who acted in the film."""
  actors: [Person!]! @relationship(type: "ACTED_IN", direction: IN, properties: "ActedIn")
  """People who directed the film."""
  directors: [Person!]! @relationship(type: "DIRECTED", direction: IN)
  """
  Films most like this one, best match first. Scored by shared director (3 points), shared cast member (2) and shared genre (1).
  """
  similar(
    """Maximum number of films to return."""
    limit: Int = 8
  ): [Movie!]!
    @cypher(
      statement: """
      MATCH (this)-[r1:IN_GENRE|ACTED_IN|DIRECTED]-(shared)-[r2:IN_GENRE|ACTED_IN|DIRECTED]-(other:Movie)
      WHERE other <> this AND type(r1) = type(r2)
      WITH other, sum(CASE type(r1) WHEN 'DIRECTED' THEN 3 WHEN 'ACTED_IN' THEN 2 ELSE 1 END) AS score
      ORDER BY score DESC, other.rating DESC, other.title
      RETURN other LIMIT $limit
      """
      columnName: "other"
    )
}

"""A person who acted in or directed films."""
type Person @node {
  """Full name. Unique within the dataset."""
  name: String!
  """Year the person was born. Only known for some people."""
  born: Int
  """Number of films the person acted in. Stored when the seed loads, so it is not updated by API mutations."""
  actedCount: Int
  """Number of films the person directed. Stored when the seed loads, so it is not updated by API mutations."""
  directedCount: Int
  """Films the person acted in."""
  actedIn: [Movie!]! @relationship(type: "ACTED_IN", direction: OUT, properties: "ActedIn")
  """Films the person directed."""
  directed: [Movie!]! @relationship(type: "DIRECTED", direction: OUT)
  """
  People this person has worked with most, ranked by number of shared films (acting or directing).
  """
  collaborators(
    """Maximum number of collaborators to return."""
    limit: Int = 8
  ): [Collaboration!]!
    @cypher(
      statement: """
      MATCH (this)-[:ACTED_IN|DIRECTED]->(m:Movie)<-[:ACTED_IN|DIRECTED]-(other:Person)
      WHERE other <> this
      WITH other, count(DISTINCT m) AS films
      ORDER BY films DESC, other.name
      LIMIT $limit
      RETURN {name: other.name, films: films} AS result
      """
      columnName: "result"
    )
}

"""A person someone has worked with, and how many films they share."""
type Collaboration {
  """Name of the collaborator. Look the person up by this name."""
  name: String!
  """Number of films the two people worked on together."""
  films: Int!
}

"""A film genre."""
type Genre @node {
  """Genre name, for example Drama."""
  name: String!
  """Films in this genre."""
  movies: [Movie!]! @relationship(type: "IN_GENRE", direction: IN)
}

"""Properties on the ACTED_IN relationship."""
type ActedIn @relationshipProperties {
  """Character names played in the film."""
  roles: [String!]!
}
