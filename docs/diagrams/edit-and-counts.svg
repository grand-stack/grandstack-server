<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" width="980" height="690" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Editing a movie: a relationship diff, then the counts refresh, then the response</title><desc id="d">The web app sends one update with only the changes. The counts plugin wraps execution: after the Neo4j GraphQL library applies the update in one transaction, the plugin recalculates every person's stored counts and only then returns the response, so the refetch shows correct counts.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="978.5" height="688.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="15.0" y="20" width="190" height="44" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="110.0" y="42" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">web app</text>
<rect x="265.0" y="20" width="190" height="44" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="360.0" y="42" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Yoga + counts plugin</text>
<rect x="515.0" y="20" width="190" height="44" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="610.0" y="42" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">@neo4j/graphql</text>
<rect x="765.0" y="20" width="190" height="44" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="860.0" y="42" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Neo4j</text>
<line x1="110" y1="64" x2="110" y2="548" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="360" y1="64" x2="360" y2="548" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="610" y1="64" x2="610" y2="548" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="860" y1="64" x2="860" y2="548" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 5"/>
<path d="M 110 104 L 360 104" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="235.0" y="97" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">updateMovies(where, update: diff)</text>
<circle cx="124" cy="82" r="11" fill="#0a6190"/>
<text x="124" y="86.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<rect x="20" y="118" width="180" height="64" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="30" y="136" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">diff = disconnect removed,</text>
<text x="30" y="152" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">connect or create added,</text>
<text x="30" y="168" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">one edge update per role</text>
<path d="M 360 166 L 610 166" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="485.0" y="159" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">execute (plugin wraps execute)</text>
<path d="M 610 210 L 860 210" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="735.0" y="203" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Cypher: the update, one transaction</text>
<path d="M 860 254 L 610 254" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="735.0" y="247" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">rows</text>
<path d="M 610 298 L 360 298" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="485.0" y="291" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">result (relationships changed)</text>
<circle cx="346" cy="276" r="11" fill="#0a6190"/>
<text x="346" y="280.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<path d="M 360 348 L 860 348" fill="none" stroke="#9a6700" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="610.0" y="341" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">recalculate actedCount, directedCount</text>
<circle cx="376" cy="326" r="11" fill="#0a6190"/>
<text x="376" y="330.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M 860 392 L 360 392" fill="none" stroke="#9a6700" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="610.0" y="385" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">done</text>
<path d="M 360 436 L 110 436" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="235.0" y="429" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">response (counts may be stale)</text>
<circle cx="124" cy="414" r="11" fill="#0a6190"/>
<text x="124" y="418.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<path d="M 110 492 L 360 492" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="235.0" y="485" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">refetch lists and the page (cache-and-network)</text>
<path d="M 360 528 L 110 528" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="235.0" y="521" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">correct counts</text>
<rect x="24" y="580" width="456" height="84" rx="6" fill="#fff4d6" stroke="#9a6700" stroke-width="1.3"/>
<text x="34" y="598" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">Why a diff, not "disconnect all, then connect":</text>
<text x="34" y="614" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">in one mutation @neo4j/graphql v7 runs the disconnect</text>
<text x="34" y="630" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">AFTER the connect and removes the links you just made.</text>
<text x="34" y="646" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">So the client sends only what changed.</text>
<circle cx="24" cy="580" r="11" fill="#0a6190"/>
<text x="24" y="584.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<rect x="500" y="580" width="456" height="84" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
<text x="510" y="598" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">The plugin runs after every mutation, even one that</text>
<text x="510" y="614" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">returned errors; a failed refresh is logged, not returned.</text>
<text x="510" y="630" font-size="11.5" font-weight="400" text-anchor="start" fill="#0f2233">It recalculates for all people, which is fine at this size.</text>
<circle cx="500" cy="580" r="11" fill="#0a6190"/>
<text x="500" y="584.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
</svg>
