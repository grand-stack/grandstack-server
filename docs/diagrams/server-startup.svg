<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">grandstack-server start-up: eight steps in order</title><desc id="d">On start the server reads config, connects to Neo4j, runs setup Cypher, seeds, builds the schema, creates Yoga, listens, and shuts down cleanly on a signal. A failure at any step exits the process with the error.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="410.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="28" y="40" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="135.5" y="62" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Read config</text>
<text x="135.5" y="82.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">environment variables;</text>
<text x="135.5" y="99.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">NEO4J_URI and</text>
<text x="135.5" y="115.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">NEO4J_PASSWORD required</text>
<circle cx="42" cy="40" r="11" fill="#0a6190"/>
<text x="42" y="44.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="135.5" y="178" font-size="12" font-weight="400" text-anchor="middle" fill="#b42318">a bad value exits, naming it</text>
<path d="M 243 99 L 271 99" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="271" y="40" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="378.5" y="62" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Connect</text>
<text x="378.5" y="82.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">create the driver and</text>
<text x="378.5" y="99.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">call verifyConnectivity</text>
<circle cx="285" cy="40" r="11" fill="#0a6190"/>
<text x="285" y="44.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="378.5" y="178" font-size="12" font-weight="400" text-anchor="middle" fill="#b42318">Neo4j down or wrong password: exits</text>
<path d="M 486 99 L 514 99" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="514" y="40" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="621.5" y="62" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Setup Cypher</text>
<text x="621.5" y="82.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">files in SETUP_CYPHER_PATHS:</text>
<text x="621.5" y="99.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">constraints, indexes;</text>
<text x="621.5" y="115.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">run on every start</text>
<circle cx="528" cy="40" r="11" fill="#0a6190"/>
<text x="528" y="44.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<path d="M 729 99 L 757 99" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="757" y="40" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="864.5" y="62" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Seed</text>
<text x="864.5" y="82.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">unless SEED=false: load,</text>
<text x="864.5" y="99.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">reload or skip the seed</text>
<text x="864.5" y="115.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">(see the seed decision)</text>
<circle cx="771" cy="40" r="11" fill="#0a6190"/>
<text x="771" y="44.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<rect x="28" y="250" width="215" height="118" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="135.5" y="272" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Build schema</text>
<text x="135.5" y="292.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">schema file plus extras;</text>
<text x="135.5" y="309.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">with AUTH_* set, tokens</text>
<text x="135.5" y="325.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">are verified via the JWKS</text>
<circle cx="42" cy="250" r="11" fill="#0a6190"/>
<text x="42" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="135.5" y="388" font-size="12" font-weight="400" text-anchor="middle" fill="#b42318">schema mistakes show up here</text>
<path d="M 243 309 L 271 309" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="271" y="250" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="378.5" y="272" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Create Yoga</text>
<text x="378.5" y="292.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">CORS, the counts plugin,</text>
<text x="378.5" y="309.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">the per-request context</text>
<circle cx="285" cy="250" r="11" fill="#0a6190"/>
<text x="285" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<path d="M 486 309 L 514 309" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="514" y="250" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="621.5" y="272" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Listen</text>
<text x="621.5" y="292.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">on PORT (default 4000);</text>
<text x="621.5" y="309.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">GraphiQL at /graphql</text>
<circle cx="528" cy="250" r="11" fill="#0a6190"/>
<text x="528" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">7</text>
<path d="M 729 309 L 757 309" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="757" y="250" width="215" height="118" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="864.5" y="272" font-size="14.5" font-weight="650" text-anchor="middle" fill="#0f2233">Shut down</text>
<text x="864.5" y="292.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">on SIGINT or SIGTERM:</text>
<text x="864.5" y="309.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">close the HTTP server</text>
<text x="864.5" y="325.5" font-size="12.5" font-weight="400" text-anchor="middle" fill="#475569">and the driver</text>
<circle cx="771" cy="250" r="11" fill="#0a6190"/>
<text x="771" y="254.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">8</text>
<path d="M 864.5 158 L 864.5 195 L 135.5 195 L 135.5 250" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
