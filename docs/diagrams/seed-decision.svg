<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Seed decision: when the server loads the seed file and when it leaves the data alone</title><desc id="d">With seeding on, the server checks for a SeedMeta marker and for existing nodes with the probe label, and compares the seed file's version. It loads into an empty database, reloads when the file is newer, skips when current, and never touches data it did not load.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="1058.5" height="468.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="380" y="24" width="300" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="530.0" y="46" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">start with SEED not false</text>
<text x="530.0" y="65" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">read the seed file and its</text>
<text x="530.0" y="80" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">// seed-version: N header</text>
<path d="M 530 90 L 530 108" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="330" y="108" width="400" height="62" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="530.0" y="130" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">ask Neo4j</text>
<text x="530.0" y="149" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">is there a (:SeedMeta {name:'movies'}) marker, with what version?</text>
<text x="530.0" y="164" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">how many nodes have the probe label (the main entity's label, Movie by default)?</text>
<circle cx="380" cy="24" r="11" fill="#0a6190"/>
<text x="380" y="28.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="330" cy="112" r="11" fill="#0a6190"/>
<text x="330" y="116.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<rect x="130" y="214" width="290" height="52" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="275.0" y="236" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">marker found</text>
<text x="275.0" y="255" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">the data was loaded by this seed</text>
<rect x="640" y="214" width="290" height="52" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="785.0" y="236" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">no marker</text>
<text x="785.0" y="255" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">fresh database, or someone else's data</text>
<path d="M 460 170 L 275 214" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 600 170 L 785 214" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40" y="330" width="210" height="112" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="145.0" y="352" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Load again</text>
<text x="145.0" y="371" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">file version is newer</text>
<text x="145.0" y="386" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">than the marker</text>
<text x="145.0" y="401" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">MERGE statements, then</text>
<text x="145.0" y="416" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">update the marker</text>
<rect x="290" y="330" width="210" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="395.0" y="352" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Skip: already loaded</text>
<text x="395.0" y="371" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">file version is the same</text>
<text x="395.0" y="386" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">or older than the marker</text>
<rect x="560" y="330" width="210" height="112" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="665.0" y="352" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Load</text>
<text x="665.0" y="371" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">no nodes with the probe</text>
<text x="665.0" y="386" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">label: run the seed,</text>
<text x="665.0" y="401" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">write the marker</text>
<rect x="810" y="330" width="210" height="112" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="915.0" y="352" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">Skip: not ours</text>
<text x="915.0" y="371" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">nodes with the probe label</text>
<text x="915.0" y="386" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">exist but there is no marker:</text>
<text x="915.0" y="401" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">treated as someone else's</text>
<text x="915.0" y="416" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">data and left alone</text>
<path d="M 230 266 L 145 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="160" y="296" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">newer</text>
<path d="M 320 266 L 395 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="380" y="296" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">same or older</text>
<path d="M 740 266 L 665 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="672" y="296" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">0 nodes</text>
<path d="M 830 266 L 915 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="900" y="296" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">has nodes</text>
<circle cx="40" cy="334" r="11" fill="#0a6190"/>
<text x="40" y="338.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="810" cy="334" r="11" fill="#0a6190"/>
<text x="810" y="338.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
</svg>
